services:
  web:
    image: queueshield-web:local
    build: ./web
    environment:
      API_URL: http://api:4000
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:?Set APP_PROXY_SECRET in the root .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  api:
    image: queueshield-api:local
    build: ./server
    environment:
      DATABASE_URL: postgres://queueshield:${POSTGRES_PASSWORD:-queueshield}@postgres:5432/queueshield
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in the root .env}
      APP_PROXY_SECRET: ${APP_PROXY_SECRET:?Set APP_PROXY_SECRET in the root .env}
      WEB_ORIGINS: http://localhost:${WEB_PORT:-3000}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queueshield}
      POSTGRES_DB: queueshield
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueshield -d queueshield"]
      interval: 5s
      timeout: 3s

volumes:
  redis:
  pg:
